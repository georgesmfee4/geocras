</defs><rect width="1240" height="900" fill="#FFFFFF"/><polygon points="88,36 272,36 272,76 262,86 88,86" fill="#F6F4EF" stroke="#1C1A17" stroke-width="1.7"/><text x="180" y="58" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#1C1A17" text-anchor="middle" font-weight="700">App mobile</text><text x="180" y="74" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="10" fill="#A39D91" text-anchor="middle" font-weight="400">client</text><line x1="180" y1="86" x2="180" y2="860" stroke="#A39D91" stroke-width="1.1" stroke-dasharray="6 5"/><polygon points="408,36 592,36 592,76 582,86 408,86" fill="#F6F4EF" stroke="#1C1A17" stroke-width="1.7"/><text x="500" y="58" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#1C1A17" text-anchor="middle" font-weight="700">Socket.io</text><text x="500" y="74" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="10" fill="#A39D91" text-anchor="middle" font-weight="400">serveur</text><line x1="500" y1="86" x2="500" y2="860" stroke="#A39D91" stroke-width="1.1" stroke-dasharray="6 5"/><polygon points="708,36 892,36 892,76 882,86 708,86" fill="#F6F4EF" stroke="#1C1A17" stroke-width="1.7"/><text x="800" y="58" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#1C1A17" text-anchor="middle" font-weight="700">API GeoCras</text><text x="800" y="74" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="10" fill="#A39D91" text-anchor="middle" font-weight="400">Express</text><line x1="800" y1="86" x2="800" y2="860" stroke="#A39D91" stroke-width="1.1" stroke-dasharray="6 5"/><polygon points="988,36 1172,36 1172,76 1162,86 988,86" fill="#F6F4EF" stroke="#1C1A17" stroke-width="1.7"/><text x="1080" y="58" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#1C1A17" text-anchor="middle" font-weight="700">PostgreSQL</text><text x="1080" y="74" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="10" fill="#A39D91" text-anchor="middle" font-weight="400">request_events</text><line x1="1080" y1="86" x2="1080" y2="860" stroke="#A39D91" stroke-width="1.1" stroke-dasharray="6 5"/><rect x="174.5" y="100" width="11" height="720" rx="0" fill="#FFFFFF" stroke="#1C1A17" stroke-width="1.4"/><rect x="494.5" y="100" width="11" height="720" rx="0" fill="#FFFFFF" stroke="#1C1A17" stroke-width="1.4"/><rect x="794.5" y="100" width="11" height="200" rx="0" fill="#FFFFFF" stroke="#1C1A17" stroke-width="1.4"/><line x1="180" y1="118" x2="500" y2="118" stroke="#1C1A17" stroke-width="1.5" marker-end="url(#arrow)"/><text x="340.0" y="110" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" font-size="11.5" fill="#1C1A17" text-anchor="middle" font-weight="400">emit request:join</text><text x="340.0" y="132" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="10" fill="#A39D91" text-anchor="middle" font-weight="400" font-style="italic">{ requestId, lastSeq: 0 }</text><line x1="500" y1="148" x2="800" y2="148" stroke="#1C1A17" stroke-width="1.5" marker-end="url(#arrow)"/><text x="650.0" y="140" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#1C1A17" text-anchor="middle" font-weight="400">vérifie le JWT et l'appartenance</text><line x1="800" y1="176" x2="500" y2="176" stroke="#1C1A17" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="650.0" y="168" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#1C1A17" text-anchor="middle" font-weight="400">autorisé</text><line x1="500" y1="204" x2="180" y2="204" stroke="#1C1A17" stroke-width="1.5" marker-end="url(#arrow)"/><text x="340.0" y="196" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" font-size="11.5" fill="#1C1A17" text-anchor="middle" font-weight="400">emit request:state</text><text x="340.0" y="218" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="10" fill="#A39D91" text-anchor="middle" font-weight="400" font-style="italic">status, lastSeq = 12</text><line x1="60" y1="236" x2="1200" y2="236" stroke="#D9D4C9" stroke-width="1"/><rect x="60" y="227" width="14" height="2.2" rx="0" fill="#E53935" stroke="none" stroke-width="0"/><text x="82" y="232" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#C62A26" text-anchor="start" font-weight="700" letter-spacing="1.3">LA CONNEXION TOMBE</text><rect x="60" y="250" width="1120" height="66" rx="4" fill="#FBF3F2" stroke="#E53935" stroke-width="1.5" stroke-dasharray="5 4"/><text x="80" y="272" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#C62A26" text-anchor="start" font-weight="700">réseau 2G, passage sous un pont : le socket est déclaré mort après le délai de garde.</text><text x="80" y="296" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#6E6A62" text-anchor="start" font-weight="400">Le mobile bascule sur la route HTTP de repli toutes les 15 s et affiche le bandeau « connexion dégradée ».</text><rect x="60" y="332" width="1120" height="88" rx="0" fill="none" stroke="#E53935" stroke-width="1.2" stroke-dasharray="5 4"/><rect x="60" y="332" width="52" height="19" rx="0" fill="#F6F4EF" stroke="#E53935" stroke-width="1.2"/><text x="86" y="345.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#1C1A17" text-anchor="middle" font-weight="700">loop</text><text x="120" y="345.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#6E6A62" text-anchor="start" font-weight="400">[mode dégradé, toutes les 15 s]</text><line x1="180" y1="374" x2="800" y2="374" stroke="#E53935" stroke-width="1.5" marker-end="url(#arrowred)"/><text x="490.0" y="366" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" font-size="11.5" fill="#E53935" text-anchor="middle" font-weight="400">GET /requests/:id</text><text x="490.0" y="388" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="10" fill="#A39D91" text-anchor="middle" font-weight="400" font-style="italic">état complet + lastSeq</text><text x="620" y="406" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="10" fill="#A39D91" text-anchor="middle" font-weight="400" font-style="italic">la donnée reste juste, seulement moins fraîche</text><line x1="60" y1="446" x2="1200" y2="446" stroke="#D9D4C9" stroke-width="1"/><rect x="60" y="437" width="14" height="2.2" rx="0" fill="#2F8F5B" stroke="none" stroke-width="0"/><text x="82" y="442" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#2F8F5B" text-anchor="start" font-weight="700" letter-spacing="1.3">LE RÉSEAU REVIENT</text><line x1="180" y1="476" x2="500" y2="476" stroke="#1C1A17" stroke-width="1.5" marker-end="url(#arrow)"/><text x="340.0" y="468" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" font-size="11.5" fill="#1C1A17" text-anchor="middle" font-weight="400">emit request:join</text><text x="340.0" y="490" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="10" fill="#A39D91" text-anchor="middle" font-weight="400" font-style="italic">{ requestId, lastSeq: 12 }</text><line x1="500" y1="506" x2="800" y2="506" stroke="#1C1A17" stroke-width="1.5" marker-end="url(#arrow)"/><text x="650.0" y="498" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#1C1A17" text-anchor="middle" font-weight="400">rejoue ce qui manque</text><line x1="800" y1="534" x2="1080" y2="534" stroke="#1C1A17" stroke-width="1.5" marker-end="url(#arrow)"/><text x="940.0" y="526" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#1C1A17" text-anchor="middle" font-weight="400">SELECT * FROM request_events</text><text x="940" y="548" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" font-size="10" fill="#A39D91" text-anchor="middle" font-weight="400" font-style="italic">WHERE request_id = $1 AND seq &gt; 12</text><rect x="1074.5" y="524" width="11" height="52" rx="0" fill="#FFFFFF" stroke="#1C1A17" stroke-width="1.4"/><line x1="1080" y1="572" x2="800" y2="572" stroke="#1C1A17" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="940.0" y="564" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#1C1A17" text-anchor="middle" font-weight="400">événements 13 → 19</text><line x1="800" y1="600" x2="500" y2="600" stroke="#1C1A17" stroke-width="1.5" marker-end="url(#arrow)"/><text x="650.0" y="592" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#1C1A17" text-anchor="middle" font-weight="400">missedEvents[]</text><line x1="500" y1="628" x2="180" y2="628" stroke="#1C1A17" stroke-width="1.5" marker-end="url(#arrow)"/><text x="340.0" y="620" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" font-size="11.5" fill="#1C1A17" text-anchor="middle" font-weight="400">emit request:state</text><text x="340.0" y="642" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="10" fill="#A39D91" text-anchor="middle" font-weight="400" font-style="italic">les 7 événements manqués, dans l'ordre des seq</text><rect x="60" y="660" width="820" height="78" rx="4" fill="#F1F8F3" stroke="#2F8F5B" stroke-width="1.5"/><text x="78" y="684" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#1C1A17" text-anchor="start" font-weight="700">L'écran se remet à jour sans que l'utilisateur ait rien à faire.</text><text x="78" y="704" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#6E6A62" text-anchor="start" font-weight="400">Aucun état n'est perdu : le journal des événements est en ajout seul, et le numéro de séquence</text><text x="78" y="718" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#6E6A62" text-anchor="start" font-weight="400">porté par le client suffit à déterminer ce qu'il n'a pas vu. C'est la même route que celle du mode dégradé.</text><rect x="60" y="762" width="1120" height="78" rx="0" fill="none" stroke="#6E6A62" stroke-width="1.2" stroke-dasharray="5 4"/><rect x="60" y="762" width="52" height="19" rx="0" fill="#F6F4EF" stroke="#6E6A62" stroke-width="1.2"/><text x="86" y="775.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#1C1A17" text-anchor="middle" font-weight="700">loop</text><text x="120" y="775.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#6E6A62" text-anchor="start" font-weight="400">[reprise nominale : 4 s et 15 m]</text><line x1="500" y1="802" x2="180" y2="802" stroke="#1C1A17" stroke-width="1.5" marker-end="url(#arrow)"/><text x="340.0" y="794" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" font-size="11.5" fill="#1C1A17" text-anchor="middle" font-weight="400">emit request:tracking</text><text x="340" y="826" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="10" fill="#A39D91" text-anchor="middle" font-weight="400" font-style="italic">le compteur « MAJ 3s » repart de Date.now() − emittedAt</text></svg>