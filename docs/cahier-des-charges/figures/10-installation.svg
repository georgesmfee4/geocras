</defs><rect width="1320" height="900" fill="#FFFFFF"/><rect x="30" y="30" width="1260" height="92" rx="4" fill="#F6F4EF" stroke="#D9D4C9" stroke-width="1.2"/><rect x="50" y="54" width="16" height="2.6" rx="0" fill="#E53935" stroke="none" stroke-width="0"/><text x="76" y="60" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#6E6A62" text-anchor="start" font-weight="700" letter-spacing="1.6">PRÉREQUIS DU POSTE</text><text x="50" y="88" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#1C1A17" text-anchor="start" font-weight="400">Node.js 22 ou plus  ·  npm 10  ·  git  ·  un compte Neon (PostgreSQL)  ·  un compte MapTiler  ·  un compte Expo pour les builds</text><polygon points="30,150 430,150 430,305 417,318 30,318" fill="#FFFFFF" stroke="#1C1A17" stroke-width="1.8"/><circle cx="60" cy="180" r="19" fill="#1C1A17" stroke="#1C1A17" stroke-width="1.6"/><text x="60" y="186" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="600">1</text><text x="92" y="186" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#1C1A17" text-anchor="start" font-weight="700">npm install</text><text x="50" y="218" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" font-size="11.5" fill="#6E6A62" text-anchor="start" font-weight="400">à la racine, une seule fois</text><text x="50" y="234" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" font-size="11.5" fill="#6E6A62" text-anchor="start" font-weight="400"></text><text x="50" y="250" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" font-size="11.5" fill="#6E6A62" text-anchor="start" font-weight="400">npm workspaces relie les trois</text><text x="50" y="266" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" font-size="11.5" fill="#6E6A62" text-anchor="start" font-weight="400">paquets entre eux par lien</text><text x="50" y="282" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" font-size="11.5" fill="#6E6A62" text-anchor="start" font-weight="400">symbolique : @geocras/shared</text><text x="50" y="298" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" font-size="11.5" fill="#6E6A62" text-anchor="start" font-weight="400">n'est pas téléchargé, il est lié.</text><line x1="430" y1="234" x2="476" y2="234" stroke="#1C1A17" stroke-width="1.8" marker-end="url(#arrow)"/><polygon points="476,150 876,150 876,305 863,318 476,318" fill="#FCECEA" stroke="#E53935" stroke-width="1.8"/><circle cx="506" cy="180" r="19" fill="#E53935" stroke="#E53935" stroke-width="1.6"/><text x="506" y="186" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="600">2</text><text x="538" y="186" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#1C1A17" text-anchor="start" font-weight="700">Compiler shared</text><text x="496" y="218" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" font-size="11.5" fill="#6E6A62" text-anchor="start" font-weight="400">npm run build --workspace</text><text x="496" y="234" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" font-size="11.5" fill="#6E6A62" text-anchor="start" font-weight="400">  @geocras/shared</text><text x="496" y="250" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" font-size="11.5" fill="#6E6A62" text-anchor="start" font-weight="400"></text><text x="496" y="266" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" font-size="11.5" fill="#6E6A62" text-anchor="start" font-weight="400">OBLIGATOIRE avant tout.</text><text x="496" y="282" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" font-size="11.5" fill="#6E6A62" text-anchor="start" font-weight="400">api et mobile importent son</text><text x="496" y="298" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" font-size="11.5" fill="#6E6A62" text-anchor="start" font-weight="400">dist/, pas ses sources.</text><line x1="876" y1="234" x2="922" y2="234" stroke="#1C1A17" stroke-width="1.8" marker-end="url(#arrow)"/><polygon points="922,150 1290,150 1290,305 1277,318 922,318" fill="#FFFFFF" stroke="#2F8F5B" stroke-width="1.8"/><circle cx="952" cy="180" r="19" fill="#2F8F5B" stroke="#2F8F5B" stroke-width="1.6"/><text x="952" y="186" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="600">3</text><text x="984" y="186" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#1C1A17" text-anchor="start" font-weight="700">Base de données</text><text x="942" y="218" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" font-size="11.5" fill="#6E6A62" text-anchor="start" font-weight="400">CREATE EXTENSION postgis;</text><text x="942" y="234" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" font-size="11.5" fill="#6E6A62" text-anchor="start" font-weight="400">cp .env.example .env</text><text x="942" y="250" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" font-size="11.5" fill="#6E6A62" text-anchor="start" font-weight="400">npm run db:migrate</text><text x="942" y="266" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" font-size="11.5" fill="#6E6A62" text-anchor="start" font-weight="400">npm run db:seed</text><text x="942" y="282" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" font-size="11.5" fill="#6E6A62" text-anchor="start" font-weight="400"></text><text x="942" y="298" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" font-size="11.5" fill="#6E6A62" text-anchor="start" font-weight="400">sur une branche dev, pas main.</text><polygon points="30,356 430,356 430,515 417,528 30,528" fill="#FFFFFF" stroke="#1C1A17" stroke-width="1.8"/><circle cx="60" cy="386" r="19" fill="#1C1A17" stroke="#1C1A17" stroke-width="1.6"/><text x="60" y="392" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="600">4</text><text x="92" y="392" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#1C1A17" text-anchor="start" font-weight="700">Secrets</text><text x="50" y="424" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" font-size="11.5" fill="#6E6A62" text-anchor="start" font-weight="400">node -e "console.log(require</text><text x="50" y="440" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" font-size="11.5" fill="#6E6A62" text-anchor="start" font-weight="400">  ('crypto').randomBytes(48)</text><text x="50" y="456" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" font-size="11.5" fill="#6E6A62" text-anchor="start" font-weight="400">  .toString('base64url'))"</text><text x="50" y="472" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" font-size="11.5" fill="#6E6A62" text-anchor="start" font-weight="400"></text><text x="50" y="488" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" font-size="11.5" fill="#6E6A62" text-anchor="start" font-weight="400">deux fois : ACCESS et REFRESH</text><text x="50" y="504" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" font-size="11.5" fill="#6E6A62" text-anchor="start" font-weight="400">doivent DIFFÉRER.</text><line x1="430" y1="442" x2="476" y2="442" stroke="#1C1A17" stroke-width="1.8" marker-end="url(#arrow)"/><polygon points="476,356 876,356 876,515 863,528 476,528" fill="#FFFFFF" stroke="#1C1A17" stroke-width="1.8"/><circle cx="506" cy="386" r="19" fill="#1C1A17" stroke="#1C1A17" stroke-width="1.6"/><text x="506" y="392" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="600">5</text><text x="538" y="392" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#1C1A17" text-anchor="start" font-weight="700">Lancer le serveur</text><text x="496" y="424" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" font-size="11.5" fill="#6E6A62" text-anchor="start" font-weight="400">npm run api</text><text x="496" y="440" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" font-size="11.5" fill="#6E6A62" text-anchor="start" font-weight="400"></text><text x="496" y="456" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" font-size="11.5" fill="#6E6A62" text-anchor="start" font-weight="400">tsx watch : rechargement à</text><text x="496" y="472" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" font-size="11.5" fill="#6E6A62" text-anchor="start" font-weight="400">chaud, pas de compilation</text><text x="496" y="488" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" font-size="11.5" fill="#6E6A62" text-anchor="start" font-weight="400">préalable. Le port 3000 par</text><text x="496" y="504" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" font-size="11.5" fill="#6E6A62" text-anchor="start" font-weight="400">défaut.</text><line x1="876" y1="442" x2="922" y2="442" stroke="#1C1A17" stroke-width="1.8" marker-end="url(#arrow)"/><polygon points="922,356 1290,356 1290,515 1277,528 922,528" fill="#FFFFFF" stroke="#1C1A17" stroke-width="1.8"/><circle cx="952" cy="386" r="19" fill="#1C1A17" stroke="#1C1A17" stroke-width="1.6"/><text x="952" y="392" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="600">6</text><text x="984" y="392" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#1C1A17" text-anchor="start" font-weight="700">Lancer le mobile</text><text x="942" y="424" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" font-size="11.5" fill="#6E6A62" text-anchor="start" font-weight="400">cp .env.example .env</text><text x="942" y="440" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" font-size="11.5" fill="#6E6A62" text-anchor="start" font-weight="400">  → clé MapTiler</text><text x="942" y="456" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" font-size="11.5" fill="#6E6A62" text-anchor="start" font-weight="400">npm run mobile</text><text x="942" y="472" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" font-size="11.5" fill="#6E6A62" text-anchor="start" font-weight="400"></text><text x="942" y="488" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" font-size="11.5" fill="#6E6A62" text-anchor="start" font-weight="400">Metro sert le bundle ;</text><text x="942" y="504" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" font-size="11.5" fill="#6E6A62" text-anchor="start" font-weight="400">l'IP est déduite de lui.</text><rect x="30" y="566" width="1260" height="190" rx="4" fill="#FFFFFF" stroke="#E53935" stroke-width="1.8"/><rect x="50" y="592" width="16" height="2.6" rx="0" fill="#E53935" stroke="none" stroke-width="0"/><text x="76" y="598" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#C62A26" text-anchor="start" font-weight="700" letter-spacing="1.6">L'ÉTAPE QU'ON NE PEUT PAS SAUTER</text><text x="50" y="630" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#1C1A17" text-anchor="start" font-weight="400">MapLibre est du code natif : il ne tourne pas dans Expo Go. Sans build de développement, l'onglet Carte reste vide.</text><text x="50" y="664" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" font-size="12.5" fill="#1C1A17" text-anchor="start" font-weight="400">npm install -g eas-cli</text><text x="50" y="684" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" font-size="12.5" fill="#1C1A17" text-anchor="start" font-weight="400">cd apps/mobile &amp;&amp; eas login</text><text x="50" y="704" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" font-size="12.5" fill="#1C1A17" text-anchor="start" font-weight="400">eas build --profile development --platform android</text><text x="50" y="736" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#6E6A62" text-anchor="start" font-weight="400" font-style="italic">EAS compile chez Expo : aucune chaîne Android locale, aucun Mac requis. On installe l'APK, puis on relance npm run mobile.</text><rect x="30" y="786" width="1260" height="90" rx="4" fill="#F6F4EF" stroke="#D9D4C9" stroke-width="1.2"/><rect x="50" y="810" width="16" height="2.6" rx="0" fill="#E0A32E" stroke="none" stroke-width="0"/><text x="76" y="816" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#6E6A62" text-anchor="start" font-weight="700" letter-spacing="1.6">LES TROIS ERREURS QUI FONT PERDRE UNE SOIRÉE</text><text x="50" y="846" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#1C1A17" text-anchor="start" font-weight="400">1.  Oublier de compiler shared → « Cannot find module @geocras/shared ».      2.  Les deux secrets JWT identiques → le serveur refuse de démarrer.</text><text x="50" y="863" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#1C1A17" text-anchor="start" font-weight="400">3.  Tester la carte dans Expo Go → écran gris, aucune erreur.</text></svg>