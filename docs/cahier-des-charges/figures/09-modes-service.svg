<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="760" viewBox="0 0 1360 760">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1C1A17"/>
  </marker>
  <marker id="arrowred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#E53935"/>
  </marker>
  <marker id="arrowmut" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#6E6A62"/>
  </marker>
  <marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#1C1A17" stroke-width="1.6"/>
  </marker>
  <marker id="openred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#E53935" stroke-width="1.6"/>
  </marker>
  <marker id="diamond" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
    <path d="M 0 6 L 6 2 L 12 6 L 6 10 z" fill="#FFFFFF" stroke="#1C1A17" stroke-width="1.3"/>
  </marker>
  <marker id="dot" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="6" markerHeight="6">
    <circle cx="4" cy="4" r="3.4" fill="#1C1A17"/>
  </marker>
  
</defs><rect width="1360" height="760" fill="#FFFFFF"/><rect x="30" y="30" width="640" height="480" rx="4" fill="#F6F4EF" stroke="#D9D4C9" stroke-width="1.2"/><rect x="50" y="54" width="16" height="2.6" rx="0" fill="#E53935" stroke="none" stroke-width="0"/><text x="76" y="60" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#6E6A62" text-anchor="start" font-weight="700" letter-spacing="1.6">MODE 1</text><text x="50" y="88" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#1C1A17" text-anchor="start" font-weight="400">on_site — le garagiste vient</text><text x="50" y="124" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#6E6A62" text-anchor="start" font-weight="400">Le véhicule ne roule plus. Le garagiste sort son</text><text x="50" y="146" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#6E6A62" text-anchor="start" font-weight="400">véhicule et se rend sur le lieu de la panne.</text><rect x="114" y="256" width="52" height="88" rx="7" fill="#FFFFFF" stroke="#1C1A17" stroke-width="2"/><circle cx="140" cy="330" r="4.5" fill="#1C1A17" stroke="#1C1A17" stroke-width="1.6"/><rect x="124" y="268" width="32" height="50" rx="0" fill="#F6F4EF" stroke="#D9D4C9" stroke-width="1"/><text x="140" y="366" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#1C1A17" text-anchor="middle" font-weight="700">GARAGE</text><polygon points="527.0,256 593.0,256 593.0,308.08 560,340 527.0,308.08" fill="#FFFFFF" stroke="#1C1A17" stroke-width="2"/><text x="560" y="290" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" font-size="20" fill="#1C1A17" text-anchor="middle" font-weight="600">!</text><text x="560" y="364" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#1C1A17" text-anchor="middle" font-weight="700">lieu de la panne</text><path d="M 180 300 L 250 268 L 330 300 L 410 274 L 490 306 L 540 300" fill="none" stroke="#E53935" stroke-width="3.2" stroke-dasharray="1 9"/><path d="M 180 300 L 250 268 L 330 300 L 410 274 L 490 306 L 540 300" fill="none" stroke="#E53935" stroke-width="1.4" opacity="0.35"/><circle cx="180" cy="300" r="4.2" fill="#E53935" stroke="#E53935" stroke-width="1.6"/><circle cx="250" cy="268" r="4.2" fill="#E53935" stroke="#E53935" stroke-width="1.6"/><circle cx="330" cy="300" r="4.2" fill="#E53935" stroke="#E53935" stroke-width="1.6"/><circle cx="410" cy="274" r="4.2" fill="#E53935" stroke="#E53935" stroke-width="1.6"/><circle cx="490" cy="306" r="4.2" fill="#E53935" stroke="#E53935" stroke-width="1.6"/><circle cx="540" cy="300" r="4.2" fill="#E53935" stroke="#E53935" stroke-width="1.6"/><line x1="490" y1="306" x2="540" y2="300" stroke="#E53935" stroke-width="2.6" marker-end="url(#arrowred)"/><text x="350" y="246" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#C62A26" text-anchor="middle" font-weight="700">trace lue : role = 'garage'</text><text x="350" y="392" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#A39D91" text-anchor="middle" font-weight="400" font-style="italic">destination : origin de la demande</text><text x="50" y="452" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#1C1A17" text-anchor="start" font-weight="700">« Je pars » appartient au GARAGISTE.</text><text x="50" y="474" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#6E6A62" text-anchor="start" font-weight="400">C'est lui qui ouvre la fenêtre de lecture de sa trace.</text><rect x="690" y="30" width="640" height="480" rx="4" fill="#F6F4EF" stroke="#D9D4C9" stroke-width="1.2"/><rect x="710" y="54" width="16" height="2.6" rx="0" fill="#2D6FD6" stroke="none" stroke-width="0"/><text x="736" y="60" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#6E6A62" text-anchor="start" font-weight="700" letter-spacing="1.6">MODE 2</text><text x="710" y="88" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#1C1A17" text-anchor="start" font-weight="400">at_garage — je vais au garage</text><text x="710" y="124" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#6E6A62" text-anchor="start" font-weight="400">Le véhicule roule encore. Le client conduit</text><text x="710" y="146" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#6E6A62" text-anchor="start" font-weight="400">jusqu'à l'atelier.</text><rect x="774" y="256" width="52" height="88" rx="7" fill="#FFFFFF" stroke="#1C1A17" stroke-width="2"/><circle cx="800" cy="330" r="4.5" fill="#1C1A17" stroke="#1C1A17" stroke-width="1.6"/><rect x="784" y="268" width="32" height="50" rx="0" fill="#F6F4EF" stroke="#D9D4C9" stroke-width="1"/><text x="800" y="366" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#1C1A17" text-anchor="middle" font-weight="700">CLIENT</text><polygon points="1180,292 1276,292 1276,368 1256,388 1180,388" fill="#E53935" stroke="#E53935" stroke-width="2"/><text x="1228" y="348" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="44" fill="#FFFFFF" text-anchor="middle" font-weight="400">⌂</text><text x="1228" y="424" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#1C1A17" text-anchor="middle" font-weight="700">atelier du garage</text><path d="M 840 300 L 910 272 L 990 302 L 1070 276 L 1150 308 L 1174 320" fill="none" stroke="#2D6FD6" stroke-width="3.2" stroke-dasharray="1 9"/><path d="M 840 300 L 910 272 L 990 302 L 1070 276 L 1150 308 L 1174 320" fill="none" stroke="#2D6FD6" stroke-width="1.4" opacity="0.35"/><circle cx="840" cy="300" r="4.2" fill="#2D6FD6" stroke="#2D6FD6" stroke-width="1.6"/><circle cx="910" cy="272" r="4.2" fill="#2D6FD6" stroke="#2D6FD6" stroke-width="1.6"/><circle cx="990" cy="302" r="4.2" fill="#2D6FD6" stroke="#2D6FD6" stroke-width="1.6"/><circle cx="1070" cy="276" r="4.2" fill="#2D6FD6" stroke="#2D6FD6" stroke-width="1.6"/><circle cx="1150" cy="308" r="4.2" fill="#2D6FD6" stroke="#2D6FD6" stroke-width="1.6"/><circle cx="1174" cy="320" r="4.2" fill="#2D6FD6" stroke="#2D6FD6" stroke-width="1.6"/><line x1="1150" y1="308" x2="1174" y2="320" stroke="#2D6FD6" stroke-width="2.6" marker-end="url(#arrowred)"/><text x="1010" y="246" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#2D6FD6" text-anchor="middle" font-weight="700">trace lue : role = 'client'</text><text x="1010" y="392" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#A39D91" text-anchor="middle" font-weight="400" font-style="italic">destination : location du garage</text><text x="710" y="452" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#1C1A17" text-anchor="start" font-weight="700">« Je pars » appartient au CLIENT.</text><text x="710" y="474" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#6E6A62" text-anchor="start" font-weight="400">Le serveur refuse ce départ au garagiste.</text><rect x="30" y="542" width="1300" height="190" rx="0" fill="#FFFFFF" stroke="#1C1A17" stroke-width="1.7"/><rect x="46" y="566" width="16" height="2.6" rx="0" fill="#E53935" stroke="none" stroke-width="0"/><text x="72" y="572" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#6E6A62" text-anchor="start" font-weight="700" letter-spacing="1.6">LE SEUL ENDROIT OÙ LE MODE DEVIENT DE LA GÉOMÉTRIE</text><text x="46" y="606" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" font-size="13" fill="#1C1A17" text-anchor="start" font-weight="400">serviceGeometry(mode, { origin, garageLocation })</text><text x="46" y="626" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" font-size="13" fill="#1C1A17" text-anchor="start" font-weight="400">  → { traveller: 'garage' | 'client',  destination: LatLng }</text><text x="46" y="668" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#6E6A62" text-anchor="start" font-weight="400">Tout ce qui a besoin de savoir quelle trace lire ou vers quoi mesurer passe par cette fonction : la preuve</text><text x="46" y="690" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#6E6A62" text-anchor="start" font-weight="400">d'arrivée, le registre des commissions, l'itinéraire affiché. Un test de mode recopié dans trois modules finit</text><text x="46" y="712" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#6E6A62" text-anchor="start" font-weight="400">toujours par en avoir un de retard.</text><text x="392" y="712" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#C62A26" text-anchor="start" font-weight="700">Et une preuve mesurée vers le mauvais point ne plante pas : elle rend « aucune preuve ».</text></svg>